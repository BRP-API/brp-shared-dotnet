services:

  identityserver:
    container_name: identityserver
    image: ghcr.io/brp-api/idp-mock:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Release
      - ASPNETCORE_URLS=http://+:6000
    ports:
      - "6000:6000"
    volumes:
      - ../test-data/IdentityServer:/app/keys
    networks:
      - brp-api-network
  
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.3.3
    environment:
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.1 200\" <&3'" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command: ["start-dev", "--http-port", "8080", "--https-port", "7443", "--import-realm"]
    ports:
      - "8081:8080"
      - "7443:7443"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json
    networks:
      - brp-api-network

networks:
  brp-api-network:
    name: brp-api-network
  