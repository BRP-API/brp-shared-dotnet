services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak
    environment:
      # KC_HOSTNAME legt de issuer ('iss' claim) vast op http://keycloak:8080/realms/brp-api,
      # ongeacht via welke URL een token wordt opgevraagd. Daardoor kunnen de tests op de host
      # tokens ophalen via http://localhost:8081 (zie features/step_definitions/world.js),
      # terwijl de issuer toch overeenkomt met OAuth__Authority van de
      # autorisatie-protocollering-proxy, die Keycloak via het Docker netwerk (brp-api-network)
      # als 'keycloak' bereikt.
      # Hierdoor hoeft 'keycloak' NIET aan het hosts bestand te worden toegevoegd (in tegenstelling
      # tot de vorige IdentityServer mock, die de issuer afleidde van de request URL en daarom via
      # http://identityserver:6000 moest worden aangeroepen).
      # Let op: flows waarbij de host zelf de issuer URL moet benaderen (bijv. een browser login)
      # vereisen wel dat 'keycloak' op de host resolvebaar is.
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.1 200\" <&3'" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command: ["start-dev", "--http-port", "8080", "--https-port", "7443", "--import-realm"]
    ports:
      - "8081:8080"
      - "7443:7443"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json
    networks:
      - brp-api-network

networks:
  brp-api-network:
    name: brp-api-network
  